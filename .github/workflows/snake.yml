name: snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#2563eb&color_dots=#ebedf0,#bfdbfe,#93c5fd,#60a5fa,#2563eb
            dist/snake-dark.svg?color_snake=#60a5fa&color_dots=#161b22,#1e3a8a,#1d4ed8,#3b82f6,#93c5fd

      - run: sed -i 's#</svg>#<style>.c{animation:none!important}.u{display:none}</style></svg>#' dist/*.svg

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
